name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare final brand assets
        run: |
          python -m pip install --quiet pillow==11.3.0 opencv-python-headless==4.12.0.88
          python scripts/prepare_brand_assets.py
          python scripts/prepare_product_photos.py

      - name: Generate controlled PDF documents
        run: |
          python -m pip install --quiet reportlab==4.4.9
          python scripts/generate_public_documents.py

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: "https://madebyhuman.org"
          NEXT_PUBLIC_SITE_INDEXABLE: "true"
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build
